<style>
  .theme-toggle {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 1000;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    border-radius: 9px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .theme-toggle:hover { background: var(--surface-hover); border-color: var(--border-hover); }
  .theme-toggle svg { width: 18px; height: 18px; display: block; }
  .theme-toggle .icon-sun { display: none; }
  :root[data-theme="light"] .theme-toggle .icon-sun { display: block; }
  :root[data-theme="light"] .theme-toggle .icon-moon { display: none; }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) .theme-toggle .icon-sun { display: block; }
    :root:not([data-theme="dark"]) .theme-toggle .icon-moon { display: none; }
  }
</style>
<script>
(function () {
  var btn = document.getElementById('theme-toggle');
  if (!btn) return;
  btn.addEventListener('click', function () {
    var root = document.documentElement;
    var current = root.dataset.theme || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    var next = current === 'light' ? 'dark' : 'light';
    root.dataset.theme = next;
    try { localStorage.setItem('theme', next); } catch (e) {}
  });
})();
</script>

": "shizuoka-bar-association", "name": "静岡県弁護士会", "path": "/organization/shizuoka-bar-association/"}, {"type": "organization", "slug": "kochi-shimbun", "name": "高知新聞", "path": "/organization/kochi-shimbun/"}]</script>
<script>
(function () {
  var TYPE_LABEL = { case: "事件", people: "人物", organization: "団体" };

  function levenshtein(a, b) {
    var m = a.length, n = b.length;
    if (!m) return n;
    if (!n) return m;
    var prev = [];
    for (var j = 0; j <= n; j++) prev[j] = j;
    for (var i = 1; i <= m; i++) {
      var cur = [i];
      for (var j = 1; j <= n; j++) {
        cur[j] = a[i - 1] === b[j - 1]
          ? prev[j - 1]
          : 1 + Math.min(prev[j - 1], prev[j], cur[j - 1]);
      }
      prev = cur;
    }
    return prev[n];
  }

  var pathname = location.pathname;
  try { pathname = decodeURIComponent(pathname); } catch (e) {}
  var rawPath = pathname.replace(/^\/+|\/+$/g, "");
  if (!rawPath || rawPath === "404.html") return;

  var pathEl = document.getElementById("attempted-path");
  pathEl.textContent = "「" + pathname + "」は見つかりませんでした";
  pathEl.hidden = false;

  var segments = rawPath.split("/");
  var category = ["case", "people", "organization"].indexOf(segments[0]) !== -1 ? segments[0] : null;
  var query = (category ? segments[1] : segments[segments.length - 1]) || "";
  if (!query) return;

  var dataEl = document.getElementById("entries-data");
  var entries = dataEl ? JSON.parse(dataEl.textContent) : [];
  var pool = category ? entries.filter(function (e) { return e.type === category; }) : entries;

  var q = query.toLowerCase();
  // slug の先頭部分だけを入力した場合（例: /people/ishiba/）は距離0扱いにする（短すぎる入力は除く）。
  // 同距離なら slug の短い方（入力に近い方）を優先する。
  var scored = pool.map(function (e) {
    var slug = e.slug.toLowerCase();
    var isPrefix = q.length >= 3 && slug.indexOf(q) === 0;
    return { entry: e, slug: slug, dist: isPrefix ? 0 : levenshtein(q, slug) };
  }).sort(function (a, b) { return a.dist - b.dist || a.slug.length - b.slug.length; });

  // 誤字の許容幅はクエリ長の4割まで。さらに最良候補から大きく離れたものは除外して無関係な候補を出さない。
  var threshold = Math.max(1, Math.floor(q.length * 0.4));
  if (!scored.length || scored[0].dist > threshold) return;
  var limit = Math.min(threshold, scored[0].dist + 2);
  var top = scored.filter(function (s) { return s.dist <= limit; }).slice(0, 5);

  var list = document.getElementById("suggestions-list");
  top.forEach(function (s) {
    var a = document.createElement("a");
    a.href = s.entry.path;
    var name = document.createElement("span");
    name.textContent = s.entry.name;
    var badge = document.createElement("span");
    badge.className = "type-badge";
    badge.textContent = TYPE_LABEL[s.entry.type] || "";
    a.appendChild(name);
    a.appendChild(badge);
    list.appendChild(a);
  });
  document.getElementById("suggestions").hidden = false;
})();
</script>
