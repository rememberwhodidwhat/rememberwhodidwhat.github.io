<style>
  :root {
    --bg:      #0f0f14;
    --surface: #1a1a24;
    --border:  #2a2a3a;
    --text:    #e8e8f0;
    --muted:   #888899;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    line-height: 1.6;
    min-height: 100vh;
  }

  a { color: inherit; text-decoration: none; }

  /* ── Header ── */
  header {
    padding: 32px 48px 24px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(135deg, #0a0018 0%, #0f0f14 100%);
  }

  .header-nav {
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 12px;
  }

  .header-nav a:hover { color: var(--text); }

  header h1 {
    font-size: 1.8rem;
    font-weight: 700;
    color: #fff;
    margin-bottom: 4px;
  }

  .header-sub {
    font-size: 0.82rem;
    color: var(--muted);
  }

  /* ── Main ── */
  main {
    max-width: 860px;
    margin: 0 auto;
    padding: 40px 48px;
  }

  /* ── Filter controls ── */
  .filter-bar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
    margin-bottom: 16px;
  }

  .filter-bar select {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 8px 12px;
    font-size: 0.88rem;
    font-family: inherit;
    outline: none;
    cursor: pointer;
  }

  .filter-bar select:focus { border-color: #4a4a6a; }

  .reset-btn {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--muted);
    padding: 8px 14px;
    font-size: 0.82rem;
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
  }

  .reset-btn:hover { border-color: #4a4a6a; color: var(--text); }

  /* ── Tag chips ── */
  .tag-filter {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 20px;
  }

  .tag-chip {
    display: inline-block;
    font-size: 0.66rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 3px 10px;
    border-radius: 999px;
    cursor: pointer;
    font-family: inherit;
    transition: opacity 0.1s;
  }

  .tag-chip:hover { opacity: 0.8; }

  /* ── Result count ── */
  .result-meta {
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 14px;
  }

  /* ── Event cards ── */
  .event {
    display: block;
    margin-bottom: 12px;
    padding: 14px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent, #555);
    border-radius: 6px;
    transition: background 0.15s;
  }

  .event:hover { background: #20202e; }

  .event-row {
    display: flex;
    align-items: flex-start;
    gap: 14px;
  }

  .event-main { flex: 1; min-width: 0; }

  .event-title-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 6px;
  }

  .event-date {
    font-size: 0.7rem;
    font-weight: 700;
    color: var(--muted);
    white-space: nowrap;
  }

  .event-title {
    font-size: 0.92rem;
    font-weight: 600;
    color: #fff;
    line-height: 1.4;
  }

  .event-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-bottom: 6px;
  }

  .tag {
    display: inline-block;
    font-size: 0.62rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    padding: 2px 6px;
    border-radius: 3px;
    white-space: nowrap;
  }

  .event-body {
    font-size: 0.82rem;
    color: #aaaabc;
    line-height: 1.75;
    white-space: pre-line;
  }

  .event-status { flex-shrink: 0; }

  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.66rem;
    font-weight: 700;
    padding: 4px 11px;
    border-radius: 999px;
    white-space: nowrap;
  }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* ── Load more ── */
  .load-more { text-align: center; margin-top: 20px; }

  .load-more-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--muted);
    padding: 10px 24px;
    font-size: 0.85rem;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }

  .load-more-btn:hover { background: #20202e; border-color: #4a4a6a; color: var(--text); }

  footer {
    padding: 24px 48px;
    border-top: 1px solid var(--border);
    font-size: 0.72rem;
    color: var(--muted);
    text-align: center;
  }
</style>

<main x-data="eventsFilter()">
  <div class="filter-bar">
    <select x-model="selectedYear">
      <option value="">すべての年</option>
      <template x-for="y in allYears" :key="y">
        <option :value="String(y)" x-text="y + '年'"></option>
      </template>
    </select>
    <select x-model="selectedStatus">
      <option value="">すべてのステータス</option>
      <template x-for="s in allStatuses" :key="s">
        <option :value="s" x-text="s"></option>
      </template>
    </select>
    <button x-show="hasFilter" @click="reset()" class="reset-btn">クリア</button>
  </div>

  <div class="tag-filter">
    <template x-for="tag in allTags" :key="tag.name">
      <button
        class="tag-chip"
        @click="toggleTag(tag.name)"
        :style="tagStyle(tag)"
        x-text="tag.name"
      ></button>
    </template>
  </div>

  <div class="result-meta">
    <span x-text="filtered.length + ' 件'"></span>
    <span x-show="hasFilter" style="margin-left:6px;color:#555">（絞り込み中）</span>
  </div>

  <div>
    <template x-for="e in displayedEvents" :key="e.slug">
      <a class="event" :href="'../case/' + e.slug + '/'" :style="'--accent:' + e.primary_color">
        <div class="event-row">
          <div class="event-main">
            <div class="event-title-row">
              <span class="event-date" x-text="e.date_display"></span>
              <span class="event-title" x-text="e.name"></span>
            </div>
            <div class="event-tags">
              <template x-for="t in e.tags" :key="t.name">
                <span class="tag" :style="'background:color-mix(in srgb,' + t.color + ' 18%,transparent);color:' + t.color + ';border:1px solid color-mix(in srgb,' + t.color + ' 40%,transparent)'" x-text="t.name"></span>
              </template>
            </div>
            <div class="event-body" x-show="e.body" x-text="e.body"></div>
          </div>
          <div class="event-status" x-show="e.status">
            <span class="status-badge"
              :style="'background:color-mix(in srgb,' + e.status_color + ' 14%,transparent);color:' + e.status_color + ';border:1px solid color-mix(in srgb,' + e.status_color + ' 38%,transparent)'"
            ><span class="status-dot" :style="'background:' + e.status_color"></span><span x-text="e.status"></span></span>
          </div>
        </div>
      </a>
    </template>
  </div>

  <div class="load-more" x-show="filtered.length > displayLimit">
    <button @click="displayLimit += 30" class="load-more-btn">
      さらに <span x-text="Math.min(30, filtered.length - displayLimit)"></span> 件を表示（残り <span x-text="filtered.length - displayLimit"></span> 件）
    </button>
  </div>
</main>

<footer>最終更新: 2026-08-19</footer>

<script>
function eventsFilter() {
  const raw = JSON.parse(document.getElementById('events-data').textContent);
  const events = [...raw].reverse();

  const tagMap = new Map();
  events.forEach(e => e.tags.forEach(t => {
    if (!tagMap.has(t.name)) tagMap.set(t.name, t.color);
  }));
  const allTags = [...tagMap.entries()]
    .map(([name, color]) => ({name, color}))
    .sort((a, b) => a.name.localeCompare(b.name, 'ja'));

  const allYears = [...new Set(events.filter(e => e.year > 0).map(e => e.year))].sort((a, b) => b - a);
  const allStatuses = [...new Set(events.map(e => e.status).filter(Boolean))];

  return {
    events,
    allTags,
    allYears,
    allStatuses,
    selectedTags: [],
    selectedYear: '',
    selectedStatus: '',
    displayLimit: 30,

    init() {
      this.$watch('selectedYear',   () => { this.displayLimit = 30; });
      this.$watch('selectedStatus', () => { this.displayLimit = 30; });
    },

    get hasFilter() {
      return this.selectedTags.length > 0 || !!this.selectedYear || !!this.selectedStatus;
    },

    get filtered() {
      return this.events.filter(e => {
        if (this.selectedYear && e.year !== Number(this.selectedYear)) return false;
        if (this.selectedStatus && e.status !== this.selectedStatus) return false;
        if (this.selectedTags.length > 0) {
          const eTags = new Set(e.tags.map(t => t.name));
          if (!this.selectedTags.every(t => eTags.has(t))) return false;
        }
        return true;
      });
    },

    get displayedEvents() {
      return this.filtered.slice(0, this.displayLimit);
    },

    toggleTag(name) {
      const idx = this.selectedTags.indexOf(name);
      if (idx === -1) this.selectedTags.push(name);
      else this.selectedTags.splice(idx, 1);
      this.displayLimit = 30;
    },

    tagStyle(tag) {
      if (this.selectedTags.includes(tag.name)) {
        return `background:${tag.color};color:#0f0f14;border:1px solid ${tag.color}`;
      }
      return `background:color-mix(in srgb,${tag.color} 12%,transparent);color:${tag.color};border:1px solid color-mix(in srgb,${tag.color} 35%,transparent)`;
    },

    reset() {
      this.selectedTags = [];
      this.selectedYear = '';
      this.selectedStatus = '';
      this.displayLimit = 30;
    },
  };
}
</script>
</body>
</html>
